<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Shelf Pop tokens */
  :root {
    --cocoa:#4b2a22; --cream:#f4e6cf; --cobalt:#1f5bb5; --paper:#fffaf2;
    --mocha:#7a5648; --sand:#d9c3a3; --wrong:#6e2438;
    --display:"Barlow Condensed","Arial Narrow",sans-serif; --sans:Barlow,Arial,sans-serif;
    --elev2:0 2px 0 rgba(75,42,34,.10),0 10px 20px -10px rgba(75,42,34,.24);
    --press:0 4px 0 rgba(75,42,34,.28); --pressed:0 1px 0 rgba(75,42,34,.28);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--cocoa); font:400 18px/1.55 var(--sans); }
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  .stamp { display:inline-block; font:700 14px/1.2 var(--display); letter-spacing:.12em; text-transform:uppercase;
    border:2px solid var(--cocoa); border-radius:999px; padding:6px 14px; }
  h1 { font:800 56px/1 var(--display); text-transform:uppercase; margin:8px 0 24px; }
  .card { background:var(--paper); border-radius:16px; padding:24px; box-shadow:var(--elev2); }
  label { display:block; font-weight:600; margin:16px 0 4px; }
  input, select { width:100%; height:48px; padding:0 14px; font:400 18px var(--sans); color:var(--cocoa);
    background:var(--paper); border:2px solid var(--mocha); border-radius:6px; }
  .hint { font-size:15px; color:var(--mocha); margin-top:4px; }
  button { font:700 20px var(--display); letter-spacing:.06em; text-transform:uppercase; min-height:52px;
    padding:0 24px; border:0; border-radius:16px; cursor:pointer; box-shadow:var(--press);
    transition:transform .1s, box-shadow .1s; }
  button:active { transform:translateY(3px); box-shadow:var(--pressed); }
  button:disabled { opacity:.5; cursor:default; }
  .primary { background:var(--cobalt); color:var(--cream); width:100%; margin-top:24px; }
  .ghost { background:var(--paper); color:var(--cocoa); border:2px solid var(--cocoa); }
  .danger { background:var(--wrong); color:var(--cream); }
  :focus-visible { outline:3px solid var(--cobalt); outline-offset:2px; }
  .primary:focus-visible { outline-color:var(--cocoa); }
  .err { color:var(--wrong); font-weight:600; margin-top:12px; min-height:24px; }
  .err:not(:empty)::before { content:"✕ "; }
  .hidden { display:none !important; }
  .resume { margin-top:24px; }
  .resume button { width:100%; margin-top:8px; text-transform:none; font:600 18px var(--sans); }

  /* Live screen */
  #vLive { text-align:center; }
  #vLive h1 { font-size:40px; margin-bottom:4px; }
  #qrbox { background:#fff; border-radius:16px; padding:16px; display:inline-block; box-shadow:var(--elev2); margin:4px 0 8px; }
  #qr img, #qr canvas { width:min(42vh, 86vw) !important; height:auto !important; display:block; }
  #track { display:block; width:min(640px, 92vw); height:104px; margin:0 auto 4px; }
  .anim-off #track, .anim-off #leap { display:none; }
  #leap { position:fixed; left:0; top:0; width:100vw; height:100vh; pointer-events:none; z-index:10; }
  .anim-off #qr img, .anim-off #qr canvas { width:min(46vh, 86vw) !important; }
  .bar { height:10px; background:var(--sand); border-radius:999px; overflow:hidden; max-width:480px; margin:0 auto 8px; }
  .bar div { height:100%; width:100%; background:var(--cobalt); }
  .row { display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .count { font:400 48px/1 "Playfair Display",Georgia,serif; }
  .count small { display:block; font:700 14px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--mocha); margin-top:6px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px) { .two { grid-template-columns:1fr; gap:0; } }
  .code { min-width:140px; font:800 40px/1 var(--display); letter-spacing:.08em; color:var(--cobalt);
    background:var(--paper); border:2px dashed var(--mocha); border-radius:16px; padding:8px 16px; }
  #bPeek { touch-action:none; user-select:none; -webkit-user-select:none; }
  .ok-msg { color:var(--cobalt); font-weight:600; min-height:24px; margin-top:4px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. Đăng nhập -->
  <section id="vLogin">
    <span class="stamp">Giáo viên</span>
    <h1>Điểm danh</h1>
    <div class="card">
      <label for="pin">Mã giáo viên</label>
      <input id="pin" type="password" autocomplete="current-password">
      <button class="primary" id="bLogin">Vào</button>
      <div class="err" id="eLogin" role="alert"></div>
    </div>
  </section>

  <!-- 2. Tạo buổi -->
  <section id="vSetup" class="hidden">
    <span class="stamp">Bước 1</span>
    <h1>Mở điểm danh</h1>
    <div class="card">
      <label for="cls">Lớp</label>
      <select id="cls"></select>
      <div class="two">
        <div>
          <label for="qrSec">Mã QR đổi sau</label>
          <select id="qrSec"></select>
        </div>
        <div>
          <label for="mode">Kiểu kiểm tra</label>
          <select id="mode">
            <option value="manual">Câu hỏi tự đặt</option>
            <option value="digits">Mã 4 chữ số</option>
            <option value="word">Từ tiếng Anh ngẫu nhiên</option>
            <option value="mix">Mã chữ và số</option>
          </select>
        </div>
      </div>
      <div id="manualBox">
        <label for="ans">Đáp án câu hỏi nhanh</label>
        <input id="ans" type="text" autocomplete="off" placeholder="Ví dụ: sustainable">
        <div class="hint">Anh đọc câu hỏi trong lớp. Đáp án không hiện trên màn hình.</div>
      </div>
      <div id="randomHint" class="hint hidden">Hệ thống tạo mã. Khi chiếu QR, giữ nút Xem mã để đọc mã cho lớp.</div>
      <button class="primary" id="bStart">Bắt đầu</button>
      <div class="err" id="eSetup" role="alert"></div>
      <div class="resume hidden" id="resumeBox">
        <div class="hint">Buổi đang mở:</div>
        <div id="resumeList"></div>
      </div>
    </div>
  </section>

  <!-- 3. Chiếu QR -->
  <section id="vLive" class="hidden">
    <span class="stamp" id="liveCls"></span>
    <h1>Quét để điểm danh</h1>
    <div id="qrbox"><div id="qr"></div></div>
    <canvas id="track" aria-hidden="true"></canvas>
    <canvas id="leap" aria-hidden="true"></canvas>
    <div class="bar"><div id="barFill"></div></div>
    <div class="hint">Mã mới sau <b id="secs">0</b> giây</div>
    <div class="row">
      <div class="count"><span id="cnt">0</span><small>Đã điểm danh</small></div>
      <div class="row hidden" id="codeRow" style="margin:0">
        <button class="ghost" id="bPeek" aria-describedby="codeShow">Giữ để xem mã</button>
        <span class="code" id="codeShow" aria-live="polite">••••</span>
        <button class="ghost" id="bNew">Đổi mã</button>
      </div>
    </div>
    <div class="row">
      <button class="ghost" id="bBack">Quay lại</button>
      <button class="ghost" id="bAnim" aria-pressed="true">Tắt hoạt hình</button>
      <button class="danger" id="bEnd">Kết thúc</button>
    </div>
    <div class="ok-msg" id="okLive" aria-live="polite"></div>
    <div class="err" id="eLive" role="alert"></div>
  </section>

</div>
<script>
  var PIN = '', CUR = null, qrObj = null, timer = null, tick = null, period = 15000, nextAt = 0;
  var MODE = 'manual', CODE = '', okTimer = null;

  function $(id) { return document.getElementById(id); }
  function show(v) { ['vLogin','vSetup','vLive'].forEach(function (x) { $(x).classList.toggle('hidden', x !== v); }); }
  function store(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function msg(e) { return e && e.message ? e.message : String(e); }

  function call(fn, args, ok, errEl, btn) {
    if (errEl) $(errEl).textContent = '';
    if (btn) btn.disabled = true;
    var r = google.script.run
      .withSuccessHandler(function (x) { if (btn) btn.disabled = false; ok(x); })
      .withFailureHandler(function (e) { if (btn) btn.disabled = false; if (errEl) $(errEl).textContent = msg(e); });
    r[fn].apply(r, args);
  }

  function renderSetup(r) {
    period = r.qrSeconds * 1000;
    var sel = $('cls'); sel.innerHTML = '';
    r.classes.forEach(function (c) { var o = document.createElement('option'); o.value = o.textContent = c; sel.appendChild(o); });
    var qs = $('qrSec'), keep = qs.value || String(r.qrSeconds), choices = (r.qrChoices || [10, 15, 20, 30, 60]).slice();
    if (choices.indexOf(r.qrSeconds) < 0) choices.push(r.qrSeconds);
    choices.sort(function (a, b) { return a - b; });
    qs.innerHTML = '';
    choices.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n + ' giây'; qs.appendChild(o); });
    qs.value = choices.indexOf(Number(keep)) >= 0 ? keep : String(r.qrSeconds);
    var box = $('resumeList'); box.innerHTML = '';
    $('resumeBox').classList.toggle('hidden', !r.openSessions.length);
    r.openSessions.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'ghost';
      b.textContent = 'Tiếp tục lớp ' + s.cls + ' (' + s.start + ')';
      b.onclick = function () { goLive(s.sessionId, s.cls); };
      box.appendChild(b);
    });
    show('vSetup');
  }

  function login(pin, silent) {
    PIN = pin;
    call('teacherLogin', [pin], function (r) {
      store('pin', pin);
      var last = load('live');
      if (last) {
        var s = JSON.parse(last);
        period = r.qrSeconds * 1000;
        var stillOpen = r.openSessions.some(function (x) { return x.sessionId === s.id; });
        if (stillOpen) { goLive(s.id, s.cls); return; }
        store('live', null);
      }
      renderSetup(r);
    }, silent ? null : 'eLogin', $('bLogin'));
  }

  $('bLogin').onclick = function () { login($('pin').value, false); };
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('bLogin').click(); });

  function syncMode() {
    var manual = $('mode').value === 'manual';
    $('manualBox').classList.toggle('hidden', !manual);
    $('randomHint').classList.toggle('hidden', manual);
  }
  $('mode').addEventListener('change', syncMode);

  $('bStart').onclick = function () {
    var opts = { mode: $('mode').value, qrSeconds: Number($('qrSec').value) };
    call('startSession', [PIN, $('cls').value, $('ans').value, opts], function (r) {
      $('ans').value = '';
      goLive(r.sessionId, r.cls, { mode: r.mode, code: r.code });
    }, 'eSetup', $('bStart'));
  };

  function setCodeUi() {
    $('codeRow').classList.toggle('hidden', MODE === 'manual');
    hideCode();
  }

  function goLive(id, cls, info) {
    CUR = id;
    store('live', JSON.stringify({ id: id, cls: cls }));
    $('liveCls').textContent = 'Lớp ' + cls;
    $('cnt').textContent = '0';
    $('eLive').textContent = '';
    $('okLive').textContent = '';
    if (info) { MODE = info.mode; CODE = info.code; setCodeUi(); }
    else {
      MODE = 'manual'; CODE = ''; setCodeUi();
      google.script.run.withSuccessHandler(function (r) {
        if (CUR !== id) return;
        MODE = r.mode; CODE = r.code; setCodeUi();
      }).getCode(PIN, id);
    }
    lastCount = -1; lastUrl = '';
    show('vLive');
    applyAnim();
    refresh();
    clearInterval(tick);
    tick = setInterval(updateBar, 200);
  }

  // Xem mã: chỉ hiện khi đang giữ nút, thả ra là ẩn
  function showCode() { if (CODE) $('codeShow').textContent = CODE; }
  function hideCode() { $('codeShow').textContent = '••••'; }
  var peek = $('bPeek');
  peek.addEventListener('pointerdown', function (e) { e.preventDefault(); showCode(); });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(function (ev) { peek.addEventListener(ev, hideCode); });
  peek.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); showCode(); } });
  peek.addEventListener('keyup', hideCode);
  peek.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  $('bNew').onclick = function () {
    if (!confirm('Đổi mã mới? Sinh viên gửi mã cũ sẽ bị tính Sai đáp án.')) return;
    var id = CUR;
    call('newCode', [PIN, id], function (r) {
      if (CUR !== id) return;
      CODE = r.code;
      hideCode();
      $('okLive').textContent = '✓ Đã đổi mã. Giữ nút để xem mã mới.';
      clearTimeout(okTimer);
      okTimer = setTimeout(function () { $('okLive').textContent = ''; }, 5000);
    }, 'eLive', $('bNew'));
  };

  /* ===== Đường chạy: bút chì (nhân vật gốc) nhảy qua sách, chồng giấy, ghế ===== */
  var Runner = (function () {
    var cv = $('track'), ctx = cv.getContext('2d'), W = 600, H = 104, GROUND = 94;
    var C = { cocoa: '#4b2a22', cream: '#f4e6cf', cobalt: '#1f5bb5', mocha: '#7a5648', sand: '#d9c3a3',
      paper: '#fffaf2', grammar: '#ffd23a', reading: '#9fd63c', speaking: '#f07ccb' };
    var THEMES = [['book', 'stack'], ['chair', 'book'], ['stack', 'chair'], ['book', 'chair', 'stack']];
    var HOME = 80, PX = 80, G = 0.6, JUMP = -8;
    var lc = $('leap'), lctx = lc.getContext('2d'), leap = null, idle = 0;
    var y = 0, vy = 0, air = false, spin = 0, t = 0, ground = 0, theme = 0;
    var obs = [], pops = [], spawnIn = 40, speed = 3.2, last = 0, raf = 0, running = false;

    function size() {
      var dpr = window.devicePixelRatio || 1;
      W = cv.clientWidth || 600;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lc.width = Math.round(innerWidth * dpr); lc.height = Math.round(innerHeight * dpr);
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function jump() { if (!air) { vy = JUMP; air = true; } }
    function spawn() {
      var list = THEMES[theme % THEMES.length], kind = list[Math.floor(Math.random() * list.length)];
      var dim = { book: [26, 16], stack: [28, 22], chair: [22, 26] }[kind];
      obs.push({ kind: kind, x: W + 10, w: dim[0], h: dim[1] });
      spawnIn = 70 + Math.random() * 80;
    }

    function drawPencil(fy) { pencilAt(ctx, PX, GROUND - fy, spin, air); }

    function pencilAt(ctx, x, base, spin, air) {
      ctx.save();
      ctx.translate(x, base - 18);
      if (spin) ctx.rotate(spin * Math.PI * 2);
      ctx.translate(0, 18);
      // chân
      ctx.strokeStyle = C.cocoa; ctx.lineWidth = 3; ctx.lineCap = 'round';
      var s = air ? 0.5 : Math.sin(t * 0.35);
      ctx.beginPath();
      ctx.moveTo(-3, -8); ctx.lineTo(-3 + s * 6, 0);
      ctx.moveTo(3, -8); ctx.lineTo(3 - s * 6, 0);
      ctx.stroke();
      // thân
      ctx.fillStyle = C.cobalt; ctx.fillRect(-7, -34, 14, 26);
      ctx.fillStyle = C.sand; ctx.fillRect(-7, -38, 14, 4);
      ctx.fillStyle = C.speaking; ctx.fillRect(-7, -8, 14, 3);
      // đầu chì
      ctx.fillStyle = C.cream;
      ctx.beginPath(); ctx.moveTo(-7, -38); ctx.lineTo(7, -38); ctx.lineTo(0, -50); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.cocoa;
      ctx.beginPath(); ctx.moveTo(-2.5, -46); ctx.lineTo(2.5, -46); ctx.lineTo(0, -50); ctx.closePath(); ctx.fill();
      // mắt
      ctx.fillStyle = C.paper;
      ctx.beginPath(); ctx.arc(-2, -28, 3, 0, 7); ctx.arc(4, -28, 3, 0, 7); ctx.fill();
      ctx.fillStyle = C.cocoa;
      ctx.beginPath(); ctx.arc(-1, -28, 1.4, 0, 7); ctx.arc(5, -28, 1.4, 0, 7); ctx.fill();
      ctx.restore();
    }

    function drawObstacle(o) {
      var x = o.x, b = GROUND;
      if (o.kind === 'book') {
        ctx.fillStyle = C.cocoa; ctx.fillRect(x, b - 16, 26, 16);
        ctx.fillStyle = C.grammar; ctx.fillRect(x, b - 16, 5, 16);
        ctx.fillStyle = C.cream; ctx.fillRect(x + 8, b - 11, 14, 2); ctx.fillRect(x + 8, b - 6, 10, 2);
      } else if (o.kind === 'stack') {
        var cols = [C.mocha, C.paper, C.reading];
        for (var i = 0; i < 3; i++) {
          ctx.fillStyle = cols[i]; ctx.fillRect(x + (i % 2) * 2, b - 7 * (i + 1) - 1, 26, 7);
          ctx.strokeStyle = C.cocoa; ctx.lineWidth = 1; ctx.strokeRect(x + (i % 2) * 2 + 0.5, b - 7 * (i + 1) - 0.5, 25, 6);
        }
      } else {
        ctx.strokeStyle = C.cocoa; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + 2, b - 26); ctx.lineTo(x + 2, b);
        ctx.moveTo(x + 2, b - 12); ctx.lineTo(x + 20, b - 12);
        ctx.moveTo(x + 20, b - 12); ctx.lineTo(x + 20, b);
        ctx.stroke();
      }
    }

    // Nhảy vòng qua mã QR: lên mép trái, vượt phía trên, đáp mép phải (không che ô QR nào)
    function startLeap() {
      var q = $('qrbox').getBoundingClientRect(), tr = cv.getBoundingClientRect();
      if (!q.width || leap || air) return false;
      var L = q.left - 34, R = q.right + 34, B = tr.top + GROUND, T = q.top - 14;
      if (L - tr.left < 10 || R > tr.right - 10 || T < 60) return false;
      leap = { L: L, R: R, B: B, T: T, p: 0, trLeft: tr.left };
      return true;
    }
    function ease(u) { return 1 - Math.pow(1 - u, 2); }
    function stepLeap(f) {
      var z = leap; z.p += f / 110;
      lctx.clearRect(0, 0, innerWidth, innerHeight);
      var p = Math.min(1, z.p), x, base, sp = 0;
      if (p < 0.33) {                       // bật lên dọc mép trái
        var u = ease(p / 0.33); x = z.L; base = z.B - (z.B - z.T) * u;
      } else if (p < 0.67) {                // vượt qua phía trên, lộn một vòng
        var v = (p - 0.33) / 0.34; x = z.L + (z.R - z.L) * v; base = z.T - Math.sin(v * Math.PI) * 26; sp = v;
      } else {                              // rơi xuống mép phải
        var w = (p - 0.67) / 0.33; x = z.R; base = z.T + (z.B - z.T) * w * w;
      }
      pencilAt(lctx, x, base, sp, true);
      if (p >= 1) {
        lctx.clearRect(0, 0, innerWidth, innerHeight);
        PX = z.R - z.trLeft; leap = null;
      }
    }

    function frame(now) {
      if (!running) return;
      var f = last ? Math.min(3, (now - last) / 16.67) : 1;
      last = now; t += f;
      if (leap) stepLeap(f);
      else if (PX > HOME) PX = Math.max(HOME, PX - 1.2 * f);   // chạy chậm lại về chỗ cũ
      idle += f;
      if (idle > 1500 && startLeap()) idle = 0;                 // thỉnh thoảng tự nhảy (khoảng 25 giây)
      // vật lý
      if (air) {
        vy += G * f; y -= vy * f;
        if (y <= 0) { y = 0; vy = 0; air = false; }
      }
      if (spin) { spin += 0.035 * f; if (spin >= 1) spin = 0; }
      ground = (ground + speed * f) % 24;
      spawnIn -= f; if (spawnIn <= 0) spawn();
      for (var i = obs.length - 1; i >= 0; i--) {
        var o = obs[i]; o.x -= speed * f;
        var gap = o.x - (PX + 7);
        if (gap > 0 && gap < 16 && !leap) jump();
        if (o.x + o.w < -10) obs.splice(i, 1);
      }
      // vẽ
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = C.mocha; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND + 0.5); ctx.lineTo(W, GROUND + 0.5); ctx.stroke();
      ctx.fillStyle = C.sand;
      for (var gx = -ground; gx < W; gx += 24) ctx.fillRect(gx, GROUND + 5, 8, 2);
      obs.forEach(drawObstacle);
      if (!leap) drawPencil(y);
      for (var k = pops.length - 1; k >= 0; k--) {
        var p = pops[k]; p.life -= f; p.y -= 0.6 * f;
        ctx.globalAlpha = Math.max(0, p.life / 60);
        ctx.fillStyle = C.cobalt; ctx.font = '800 22px "Barlow Condensed", "Arial Narrow", sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(p.text, Math.min(W - 20, PX + 30), Math.max(22, GROUND - 40 + p.y * 0.5));
        ctx.globalAlpha = 1;
        if (p.life <= 0) pops.splice(k, 1);
      }
      raf = requestAnimationFrame(frame);
    }

    return {
      start: function () {
        if (running) return;
        running = true; last = 0; size(); raf = requestAnimationFrame(frame);
      },
      stop: function () { running = false; cancelAnimationFrame(raf); obs = []; pops = []; y = 0; air = false; spin = 0;
        leap = null; PX = HOME; idle = 0; lctx.clearRect(0, 0, innerWidth, innerHeight); },
      cheer: function (n) { pops.push({ text: '+' + n, y: 0, life: 60 }); idle = 0; if (!startLeap()) { spin = 0.001; jump(); } },
      next: function () { theme++; },
      resize: function () { if (running) size(); }
    };
  })();
  window.addEventListener('resize', Runner.resize);

  // Bật/tắt hoạt hình (nhớ theo máy, mặc định tắt nếu máy bật giảm chuyển động)
  var ANIM = (function () {
    try { var v = localStorage.getItem('dd_anim'); if (v) return v === 'on'; } catch (e) {}
    return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  })();
  function applyAnim() {
    document.body.classList.toggle('anim-off', !ANIM);
    $('bAnim').textContent = ANIM ? 'Tắt hoạt hình' : 'Bật hoạt hình';
    $('bAnim').setAttribute('aria-pressed', String(ANIM));
    if (ANIM && CUR) Runner.start(); else Runner.stop();
  }
  $('bAnim').onclick = function () {
    ANIM = !ANIM;
    try { localStorage.setItem('dd_anim', ANIM ? 'on' : 'off'); } catch (e) {}
    applyAnim();
  };
  var lastCount = -1, lastUrl = '';

  function refresh() {
    clearTimeout(timer);
    if (!CUR) return;
    var id = CUR;
    google.script.run.withSuccessHandler(function (r) {
      if (CUR !== id) return;
      $('eLive').textContent = '';
      $('cnt').textContent = r.count;
      if (lastCount >= 0 && r.count > lastCount && ANIM) Runner.cheer(r.count - lastCount);
      lastCount = r.count;
      period = r.qrSeconds * 1000;
      if (r.status !== 'OPEN') { $('eLive').textContent = 'Buổi này đã kết thúc.'; return; }
      if (r.url !== lastUrl) {
        if (!qrObj) qrObj = new QRCode($('qr'), { text: r.url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
        else qrObj.makeCode(r.url);
        if (lastUrl) Runner.next();
        lastUrl = r.url;
      }
      nextAt = Date.now() + r.msLeft;
      // Cập nhật số điểm danh mỗi 5 giây, và ngay khi mã QR đến hạn đổi
      timer = setTimeout(refresh, Math.min(r.msLeft + 300, 5000));
    }).withFailureHandler(function (e) {
      if (CUR !== id) return;
      $('eLive').textContent = 'Mất kết nối, đang thử lại. ' + msg(e);
      timer = setTimeout(refresh, 3000);
    }).getQr(PIN, id);
  }

  function updateBar() {
    var left = Math.max(0, nextAt - Date.now());
    $('secs').textContent = Math.ceil(left / 1000);
    $('barFill').style.width = Math.min(100, 100 * left / period) + '%';
  }

  function stopLive() { CUR = null; CODE = ''; hideCode(); Runner.stop(); store('live', null); clearTimeout(timer); clearInterval(tick); }

  $('bBack').onclick = function () {
    stopLive();
    call('teacherLogin', [PIN], renderSetup, 'eLive', $('bBack'));
  };

  $('bEnd').onclick = function () {
    if (!confirm('Kết thúc buổi này? Sinh viên sẽ không quét được nữa.')) return;
    var id = CUR;
    stopLive();
    call('endSession', [PIN, id], function (r) {
      alert('Đã kết thúc. Tổng số điểm danh: ' + r.count);
      call('teacherLogin', [PIN], renderSetup, 'eSetup');
    }, 'eLive', $('bEnd'));
  };

  // Tự đăng nhập lại khi tải lại trang (cùng tab)
  var saved = load('pin');
  if (saved) login(saved, true);
</script>
</body>
</html>
