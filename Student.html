<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cocoa:#4b2a22; --cream:#f4e6cf; --cobalt:#1f5bb5; --paper:#fffaf2;
    --mocha:#7a5648; --wrong:#6e2438;
    --display:"Barlow Condensed","Arial Narrow",sans-serif; --sans:Barlow,Arial,sans-serif;
    --elev2:0 2px 0 rgba(75,42,34,.10),0 10px 20px -10px rgba(75,42,34,.24);
    --press:0 4px 0 rgba(75,42,34,.28); --pressed:0 1px 0 rgba(75,42,34,.28);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--cocoa); font:400 18px/1.55 var(--sans); }
  .wrap { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  .stamp { display:inline-block; font:700 14px/1.2 var(--display); letter-spacing:.12em; text-transform:uppercase;
    border:2px solid var(--cocoa); border-radius:999px; padding:6px 14px; }
  h1 { font:800 48px/1 var(--display); text-transform:uppercase; margin:8px 0 20px; }
  .card { background:var(--paper); border-radius:16px; padding:20px; box-shadow:var(--elev2); }
  label { display:block; font-weight:600; margin:16px 0 4px; }
  label:first-child { margin-top:0; }
  input { width:100%; height:52px; padding:0 14px; font:400 18px var(--sans); color:var(--cocoa);
    background:var(--paper); border:2px solid var(--mocha); border-radius:6px; }
  .hint { font-size:15px; color:var(--mocha); margin-top:4px; }
  button { width:100%; margin-top:24px; min-height:56px; font:700 22px var(--display); letter-spacing:.06em;
    text-transform:uppercase; background:var(--cobalt); color:var(--cream); border:0; border-radius:16px;
    cursor:pointer; box-shadow:var(--press); transition:transform .1s, box-shadow .1s; }
  button:active { transform:translateY(3px); box-shadow:var(--pressed); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:3px solid var(--cobalt); outline-offset:2px; }
  button:focus-visible { outline-color:var(--cocoa); }
  .err { color:var(--wrong); font-weight:600; margin-top:12px; min-height:24px; }
  .err:not(:empty)::before { content:"✕ "; }
  .hidden { display:none !important; }
  .result { text-align:center; padding:32px 20px; }
  .badge { width:96px; height:96px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center;
    justify-content:center; font:800 56px/1 var(--display); color:var(--cream); }
  .ok .badge { background:var(--cobalt); }
  .bad .badge { background:var(--wrong); }
  .result .stamp { font-size:18px; }
  .ok .stamp { color:var(--cobalt); border-color:var(--cobalt); }
  .bad .stamp { color:var(--wrong); border-color:var(--wrong); }
  .result p { margin:16px 0 0; }
  .pop { animation:pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <section id="vLoading">
    <span class="stamp">Điểm danh</span>
    <h1>Đang kiểm tra</h1>
    <p class="hint">Chờ một chút nhé.</p>
  </section>

  <section id="vForm" class="hidden">
    <span class="stamp" id="clsStamp"></span>
    <h1>Điểm danh</h1>
    <div class="card">
      <label for="sid">Mã sinh viên</label>
      <input id="sid" autocomplete="off" autocapitalize="characters" inputmode="text">
      <label for="name">Họ và tên</label>
      <input id="name" autocomplete="name">
      <label for="ans">Trả lời câu hỏi của thầy</label>
      <input id="ans" autocomplete="off" autocapitalize="none">
      <div class="hint">Còn <b id="left">0:00</b> để gửi.</div>
      <button id="bSend">Gửi điểm danh</button>
      <div class="err" id="eForm" role="alert"></div>
    </div>
  </section>

  <section id="vDone" class="hidden">
    <div class="card result pop" id="doneCard">
      <div class="badge" id="doneIcon" aria-hidden="true"></div>
      <span class="stamp" id="doneStamp"></span>
      <p id="doneText"></p>
    </div>
  </section>

</div>
<script>
  var SESSION_ID = <?!= JSON.stringify(sessionId) ?>;
  var TOKEN = <?!= JSON.stringify(token) ?>;
  var ticket = '', expiresAt = 0, countdown = null;

  function $(id) { return document.getElementById(id); }
  function show(v) { ['vLoading','vForm','vDone'].forEach(function (x) { $(x).classList.toggle('hidden', x !== v); }); }
  function msg(e) { return e && e.message ? e.message : String(e); }
  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function deviceId() {
    var id = get('dd_device');
    if (!id) {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      // Trình duyệt không cho lưu: dùng mã tạm, máy chủ sẽ đánh dấu để giáo viên xem lại
      if (!put('dd_device', id)) id = 'tmp' + id;
    }
    return id;
  }

  function done(ok, title, text) {
    clearInterval(countdown);
    $('doneCard').className = 'card result pop ' + (ok ? 'ok' : 'bad');
    $('doneIcon').textContent = ok ? '✓' : '✕';
    $('doneStamp').textContent = title;
    $('doneText').textContent = text;
    show('vDone');
  }

  function getIp() {
    return new Promise(function (resolve) {
      var t = setTimeout(function () { resolve(''); }, 5000);
      fetch('https://api.ipify.org?format=json').then(function (r) { return r.json(); })
        .then(function (j) { clearTimeout(t); resolve(j.ip || ''); })
        .catch(function () { clearTimeout(t); resolve(''); });
    });
  }

  function tickLeft() {
    var s = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
    $('left').textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    if (s === 0) done(false, 'Hết giờ', 'Hãy quét lại mã QR trên màn hình.');
  }

  var DEV = deviceId();

  if (!SESSION_ID || !TOKEN) {
    done(false, 'Chưa quét mã', 'Hãy dùng camera điện thoại quét mã QR thầy chiếu trên màn hình.');
  } else {
    google.script.run.withSuccessHandler(function (r) {
      ticket = r.ticket;
      expiresAt = Date.now() + r.ticketMinutes * 60000;
      $('clsStamp').textContent = 'Lớp ' + r.cls;
      $('sid').value = get('dd_sid');
      $('name').value = get('dd_name');
      show('vForm');
      ($('sid').value ? $('ans') : $('sid')).focus();
      tickLeft();
      countdown = setInterval(tickLeft, 1000);
    }).withFailureHandler(function (e) {
      done(false, 'Không mở được', msg(e));
    }).openScan(SESSION_ID, TOKEN, DEV);
  }

  $('bSend').onclick = function () {
    var sid = $('sid').value.trim(), name = $('name').value.trim(), ans = $('ans').value.trim();
    if (!sid || !name || !ans) { $('eForm').textContent = 'Hãy điền đủ 3 ô.'; return; }
    $('eForm').textContent = '';
    $('bSend').disabled = true;
    $('bSend').textContent = 'Đang gửi';
    getIp().then(function (ip) {
      google.script.run.withSuccessHandler(function (r) {
        put('dd_sid', sid); put('dd_name', name);
        done(true, 'Đã điểm danh', r.review
          ? 'Đã ghi nhận. Thầy sẽ xem lại một số thông tin của buổi này.'
          : 'Bạn đã có mặt trong lớp ' + r.cls + '.');
      }).withFailureHandler(function (e) {
        $('bSend').disabled = false;
        $('bSend').textContent = 'Gửi điểm danh';
        $('eForm').textContent = msg(e);
      }).submitAttendance({ sessionId: SESSION_ID, ticket: ticket, deviceId: DEV,
        studentId: sid, name: name, answer: ans, ip: ip });
    });
  };
  $('ans').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('bSend').click(); });
</script>
</body>
</html>
